server {
    listen 80;
    listen [::]:80;
    server_name tinytashkent.uz www.tinytashkent.uz;
    root /var/www/tiny-tashkent/current/public;
    index index.html;
    access_log /var/log/nginx/tiny-tashkent.access.log combined;
    error_log /var/log/nginx/tiny-tashkent.error.log;
    server_tokens off;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tiny-tashkent/acme;
        try_files $uri =404;
    }
    location = /api/visitors {
        proxy_pass http://127.0.0.1:3040;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header OAI-Authenticated-User-Id "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:3040;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /data/tiles-v10/ {
        expires 1y;
        try_files $uri =404;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ /\. { deny all; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
